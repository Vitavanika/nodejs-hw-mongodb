summary: Get a list of contacts
description: eturns a paginated list of contacts for the authenticated user, with optional filters.
tags:
  - Contacts
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: limit
    in: query
    description: Number of items per page.
    schema:
      type: integer
      minimum: 1
      default: 10
  - name: contactType
    in: query
    description: Filter contacts by type (e.g., personal, work).
    schema:
      type: string
responses:
  '200':
    description: A list of contacts was successfully retrieved.
    content:
      application/json:
        schema:
          type: object
          properties:
            contacts:
              type: array
              items:
                $ref: '../../components/schemas/Contact.yaml'
            totalPages:
              type: integer
              description: Total number of pages available.
            currentPage:
              type: integer
              description: Current page number.
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
     $ref: ../../components/responses/500.yaml
