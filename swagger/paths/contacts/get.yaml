summary: Get a list of contacts
description: Returns a paginated list of contacts for the authenticated user, with optional filters.
tags:
  - Contacts
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: perPage
    in: query
    description: Number of items per page.
    schema:
      type: integer
      minimum: 1
      default: 10
  - name: sortBy
    in: query
    description: Sort field name.
    schema:
      type: string
      example: name
  - name: sortOrder
    in: query
    description: Sort direction (asc or desc).
    schema:
      type: string
      enum: [asc, desc]
  - name: contactType
    in: query
    description: Filter by contact type (work, personal, home)
    schema:
      type: string
      enum: [work, personal, home]
  - name: isFavourite
    in: query
    description: Filter by favourite status.
    schema:
      type: boolean

responses:
  '200':
    description: A list of contacts was successfully retrieved.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
              description: HTTP status code
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/Contact.yaml
                page:
                    type: integer
                    example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 20
                totalPages:
                  type: integer
                  example: 10
                hasNextPage:
                    type: boolean
                    example: true
                hasPreviousPage:
                  type: boolean
                  example: false

  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
