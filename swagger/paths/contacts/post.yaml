summary: Get a list of contacts
description: |
  Returns a paginated list of contacts for the authenticated user, with optional filters.
tags:
  - Contacts
operationId: createContact
security:
  - bearerAuth: []
parameters:
  - name: name
    in: query
    description: Filter contacts by name.
    schema:
      type: string
  - name: phoneNumber
    in: query
    description: Filter contacts by phone number.
    schema:
      type: string
  - name: contactType
    in: query
    description: Filter contacts by type (e.g., personal, work).
    schema:
      type: string
      enum: ['personal', 'work', 'family']
  - name: isFavourite
    in: query
    description: Filter contacts by favourite status.
    schema:
      type: boolean
  - name: page
    in: query
    description: Page number for pagination.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: limit
    in: query
    description: Number of items per page.
    schema:
      type: integer
      minimum: 1
      default: 10
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: The name of the contact.
          phoneNumber:
            type: string
            description: The phone number of the contact.
          contactType:
            type: string
            enum: ['personal', 'work', 'family']
            description: The type of the contact.
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
          photo:
            type: string
            format: binary
            description: The profile picture of the contact.
responses:
  '200':
    description: A list of contacts was successfully retrieved.
    content:
      application/json:
        schema:
          type: object
          properties:
            contacts:
              type: array
              items:
                $ref: '../../components/schemas/Contact.yaml'
            totalPages:
              type: integer
              description: Total number of pages available.
            currentPage:
              type: integer
              description: Current page number.
            totalItems:
              type: integer
              description: Total number of contacts available.
  '401':
    $ref: ../../components/responses/401.yaml