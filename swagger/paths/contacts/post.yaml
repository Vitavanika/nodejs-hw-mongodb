summary: Create a new contact
description: Creates a new contact with the provided data.
tags:
  - Contacts
operationId: createContact
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: The name of the contact.
            example: John Doe
          phoneNumber:
            type: string
            description: The phone number of the contact.
            example: +1234567890
          email:
            type: string
            description: The email of the contact.
            example: email@example.com
          contactType:
            type: string
            enum: ['personal', 'work', 'family']
            description: The type of the contact.
          isFavourite:
            type: boolean
            description: Whether the contact is a favourite or not.
          photo:
            type: string
            format: binary
            description: The photo of the contact.
responses:
  '200':
    description: Contact created successfully.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
              description: HTTP status code
            message:
              type: string
              example: 'Contact created successfully!'
            data:
              type: object
              $ref: '../../components/schemas/Contact.yaml'
  '401':
    $ref: ../../components/responses/401.yaml